name: Tests

# Runs the test suite (tests/) once per county profile on every push and pull
# request. No AI model or network services are needed.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        county: [tippecanoe, hamilton]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest httpx
      - run: python -m pytest -q tests
        env:
          COUNTY: ${{ matrix.county }}
