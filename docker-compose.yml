# Mac mini:  run Ollama natively (it uses the GPU), then `docker compose up -d`
# NAS:       set COMPOSE_PROFILES=ollama and OLLAMA_URL=http://ollama:11434 in .env
#            (runs Ollama in a container on the CPU), then `docker compose up -d`
services:

  app:
    image: ghcr.io/${GHCR_OWNER:-owenwright8}/dispatch-monitor:latest
    # To build from source instead, uncomment:
    # build: .
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8086}:8080"
    env_file:
      - path: .env
        required: false
    environment:
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:7b}
      - WHISPER_MODEL=${WHISPER_MODEL:-small.en}
      - BACKFILL_HOURS=${BACKFILL_HOURS:-24}
    volumes:
      - dispatch-data:/data          # database, archived audio, street index, Whisper model
    extra_hosts:
      - "host.docker.internal:host-gateway"

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=30m
      - OLLAMA_NUM_PARALLEL=1

volumes:
  dispatch-data:
  ollama-models:
